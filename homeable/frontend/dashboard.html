<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — Homeable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="account">

<div id="site-header"></div>

<div class="page-header">
  <span class="eyebrow">Account</span>
  <h1 id="dashGreeting">My Account</h1>
</div>

<div id="dashboardRoot" class="container-xl section-sm" style="padding-top:0;">
  <div class="dash-layout">
    <!-- SIDEBAR -->
    <aside class="dash-sidebar">
      <a href="#tab-orders" class="dash-nav-link active" data-tab="tab-orders"><i class="bi bi-bag"></i> My Orders</a>
      <a href="#tab-profile" class="dash-nav-link" data-tab="tab-profile"><i class="bi bi-person"></i> Profile</a>
      <a href="#tab-addresses" class="dash-nav-link" data-tab="tab-addresses"><i class="bi bi-geo-alt"></i> Saved Addresses</a>
      <a href="#tab-password" class="dash-nav-link" data-tab="tab-password"><i class="bi bi-shield-lock"></i> Change Password</a>
      <a href="/wishlist.html"><i class="bi bi-heart"></i> Wishlist</a>
      <hr>
      <a href="#" data-logout><i class="bi bi-box-arrow-right"></i> Logout</a>
    </aside>

    <!-- CONTENT -->
    <div>
      <div class="dash-tab-content" id="tab-orders">
        <div class="bg-surface rounded-luxe shadow-luxe p-4">
          <h5 class="mb-3">Order History</h5>
          <div id="ordersList"></div>
        </div>
      </div>

      <div class="dash-tab-content" id="tab-profile" style="display:none;">
        <div class="bg-surface rounded-luxe shadow-luxe p-4 form-luxe">
          <h5 class="mb-3">Profile Information</h5>
          <form id="profileForm">
            <div class="row g-3">
              <div class="col-md-6"><label>Full Name</label><input type="text" id="profileFullName" class="form-control"></div>
              <div class="col-md-6"><label>Email</label><input type="email" id="profileEmail" class="form-control" disabled></div>
              <div class="col-md-6"><label>Phone</label><input type="text" id="profilePhone" class="form-control"></div>
            </div>
            <button type="submit" class="btn btn-dark mt-3">Save Changes</button>
          </form>
        </div>
      </div>

      <div class="dash-tab-content" id="tab-addresses" style="display:none;">
        <div class="bg-surface rounded-luxe shadow-luxe p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0">Saved Addresses</h5>
            <button class="btn btn-outline btn-sm" data-bs-toggle="modal" data-bs-target="#addAddressModal">+ Add Address</button>
          </div>
          <div id="addressList"></div>
        </div>
      </div>

      <div class="dash-tab-content" id="tab-password" style="display:none;">
        <div class="bg-surface rounded-luxe shadow-luxe p-4 form-luxe">
          <h5 class="mb-3">Change Password</h5>
          <form id="passwordForm">
            <div class="mb-3"><label>Current Password</label><input type="password" id="currentPassword" class="form-control" required></div>
            <div class="mb-3"><label>New Password</label><input type="password" id="newPasswordDash" class="form-control" minlength="8" required></div>
            <div class="mb-3"><label>Confirm New Password</label><input type="password" id="confirmPasswordDash" class="form-control" minlength="8" required></div>
            <button type="submit" class="btn btn-dark">Update Password</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add Address Modal -->
<div class="modal fade" id="addAddressModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content form-luxe" style="border-radius: var(--radius-md); border:none;">
      <div class="modal-header"><h5 class="modal-title">Add Address</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <form id="addressForm">
        <div class="modal-body row g-3">
          <div class="col-md-6"><label>Label</label><input type="text" id="addrLabel" class="form-control" placeholder="Home"></div>
          <div class="col-md-6"><label>Full Name</label><input type="text" id="addrFullName" class="form-control" required></div>
          <div class="col-md-6"><label>Phone</label><input type="text" id="addrPhone" class="form-control" required></div>
          <div class="col-md-6"><label>Country</label><input type="text" id="addrCountry" class="form-control" placeholder="Pakistan"></div>
          <div class="col-12"><label>Address Line 1</label><input type="text" id="addrLine1" class="form-control" required></div>
          <div class="col-12"><label>Address Line 2</label><input type="text" id="addrLine2" class="form-control"></div>
          <div class="col-md-4"><label>City</label><input type="text" id="addrCity" class="form-control" required></div>
          <div class="col-md-4"><label>State</label><input type="text" id="addrState" class="form-control" required></div>
          <div class="col-md-4"><label>Postal Code</label><input type="text" id="addrPostal" class="form-control" required></div>
          <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" id="addrDefault"><label class="form-check-label">Set as default address</label></div></div>
        </div>
        <div class="modal-footer"><button type="submit" class="btn btn-primary">Save Address</button></div>
      </form>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/partials.js"></script>
<script src="js/main.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
<script>
document.querySelectorAll('.dash-nav-link').forEach(link => {
  link.addEventListener('click', (e) => {
    e.preventDefault();
    document.querySelectorAll('.dash-nav-link').forEach(l => l.classList.remove('active'));
    link.classList.add('active');
    document.querySelectorAll('.dash-tab-content').forEach(t => t.style.display = 'none');
    document.getElementById(link.dataset.tab).style.display = 'block';
  });
});
</script>
</body>
</html>
