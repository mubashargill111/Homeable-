<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Homeable</title>
<meta http-equiv="refresh" content="0; url=create-account.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="account">

<div id="site-header"></div>

<div class="auth-card form-luxe">
  <h2>Create your account</h2>
  <p class="sub">Join Homeable for faster checkout and order tracking.</p>

  <form id="registerForm">
    <div class="mb-3"><label>Full Name</label><input type="text" id="fullName" class="form-control" required></div>
    <div class="mb-3"><label>Email Address</label><input type="email" id="email" class="form-control" required></div>
    <div class="mb-3"><label>Phone</label><input type="text" id="phone" class="form-control"></div>
    <div class="mb-3"><label>Password</label><input type="password" id="password" class="form-control" minlength="8" required></div>
    <div class="mb-4"><label>Confirm Password</label><input type="password" id="confirmPassword" class="form-control" minlength="8" required></div>
    <button type="submit" class="btn btn-primary btn-block">Create Account</button>
  </form>

  <p class="text-center mt-4" style="font-size:14px;">
    Already have an account? <a href="/login.html" class="text-accent">Sign in</a>
  </p>
</div>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/partials.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
