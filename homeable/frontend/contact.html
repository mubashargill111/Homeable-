<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us — Homeable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">

<div id="site-header"></div>

<div class="page-header">
  <span class="eyebrow">We'd love to hear from you</span>
  <h1>Contact Us</h1>
  <div class="breadcrumb-luxe"><a href="/index.html">Home</a> / Contact</div>
</div>

<div class="container-xl section-sm" style="padding-top:0;">
  <div class="row g-5">
    <div class="col-lg-5">
      <div class="bg-surface rounded-luxe shadow-luxe p-4 mb-4">
        <i class="bi bi-geo-alt text-accent" style="font-size:22px;"></i>
        <h6 class="mt-2">Studio Address</h6>
        <p class="text-muted mb-0">12 UET Lahore, Punjab, Pakistan</p>
      </div>
      <div class="bg-surface rounded-luxe shadow-luxe p-4 mb-4">
        <i class="bi bi-envelope text-accent" style="font-size:22px;"></i>
        <h6 class="mt-2">Email</h6>
        <p class="text-muted mb-0">hello@homeable.com</p>
      </div>
      <div class="bg-surface rounded-luxe shadow-luxe p-4 mb-4">
        <i class="bi bi-telephone text-accent" style="font-size:22px;"></i>
        <h6 class="mt-2">Phone</h6>
        <p class="text-muted mb-0">+92 318 8437080</p>
      </div>
      <!-- Google Maps placeholder -->
      <div class="rounded-luxe shadow-luxe" style="height:220px; background:var(--color-accent-light); display:flex; align-items:center; justify-content:center; color:var(--color-accent-dark);">
        <span><i class="bi bi-map"></i> Map placeholder</span>
      </div>
    </div>

    <div class="col-lg-7">
      <div class="bg-surface rounded-luxe shadow-luxe p-4 form-luxe">
        <h5 class="mb-4">Send us a message</h5>
        <form id="contactForm">
          <div class="row g-3">
            <div class="col-md-6"><label>Name</label><input type="text" id="contactName" class="form-control" required></div>
            <div class="col-md-6"><label>Email</label><input type="email" id="contactEmail" class="form-control" required></div>
            <div class="col-12"><label>Subject</label><input type="text" id="contactSubject" class="form-control"></div>
            <div class="col-12"><label>Message</label><textarea id="contactMessage" class="form-control" rows="5" required></textarea></div>
          </div>
          <button type="submit" class="btn btn-primary mt-4">Send Message</button>
        </form>
      </div>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/partials.js"></script>
<script src="js/main.js"></script>
<script src="js/contact.js"></script>
</body>
</html>
