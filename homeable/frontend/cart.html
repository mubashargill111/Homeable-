<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — Homeable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cart">

<div id="site-header"></div>

<div class="page-header">
  <span class="eyebrow">Review your items</span>
  <h1>Shopping Cart</h1>
  <div class="breadcrumb-luxe"><a href="/index.html">Home</a> / Cart</div>
</div>

<div class="container-xl section-sm" style="padding-top:0;">
  <div class="row g-5">
    <div class="col-lg-8">
      <div id="cartItems"></div>
      <div id="cartEmpty" class="empty-state" style="display:none;">
        <div class="icon"><i class="bi bi-bag"></i></div>
        <h4>Your cart is empty</h4>
        <p class="text-muted">Looks like you haven't added anything yet.</p>
        <a href="/shop.html" class="btn btn-primary mt-3">Continue Shopping</a>
      </div>
    </div>
    <div class="col-lg-4">
      <div class="cart-summary" id="cartSummaryBox" style="display:none;">
        <h5 class="mb-4">Order Summary</h5>
        <div class="summary-row"><span>Subtotal</span><span id="summarySubtotal">$0.00</span></div>
        <div class="summary-row"><span>Discount</span><span id="summaryDiscount">$0.00</span></div>
        <div class="summary-row"><span>Shipping</span><span id="summaryShipping">$0.00</span></div>
        <div class="summary-row"><span>Tax</span><span id="summaryTax">$0.00</span></div>
        <div class="summary-row total"><span>Total</span><span id="summaryTotal">$0.00</span></div>

        <form id="couponForm" class="d-flex gap-2 my-3">
          <input type="text" id="couponInput" class="form-control form-control-sm" placeholder="Coupon code (try WELCOME10)">
          <button class="btn btn-outline btn-sm" type="submit">Apply</button>
        </form>

        <a href="/checkout.html" class="btn btn-primary btn-block">Proceed to Checkout</a>
      </div>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/partials.js"></script>
<script src="js/main.js"></script>
<script src="js/utils.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
