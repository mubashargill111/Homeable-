<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Homeable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="account">

<div id="site-header"></div>

<div class="auth-card form-luxe">
  <h2>Forgot your password?</h2>
  <p class="sub">Enter your email and we'll generate a reset link.</p>

  <form id="forgotForm">
    <div class="mb-4"><label>Email Address</label><input type="email" id="email" class="form-control" required></div>
    <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
  </form>

  <div id="forgotResult" class="mt-4" style="display:none; font-size:14px; background:var(--color-accent-light); padding:16px; border-radius:var(--radius-sm);"></div>

  <p class="text-center mt-4" style="font-size:14px;">
    <a href="/login.html" class="text-accent">← Back to Sign In</a>
  </p>
</div>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/partials.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
