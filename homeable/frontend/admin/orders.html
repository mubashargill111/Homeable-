<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Orders — Homeable Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-admin-page="orders">

<div class="admin-shell" id="adminShell">
  <div id="adminSidebarMount"></div>

  <main class="admin-main" id="adminOrdersRoot">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div><span class="eyebrow">Fulfillment</span><h2 style="margin:0;">Orders</h2></div>
      <select id="orderStatusFilter" class="form-select" style="width:auto;">
        <option value="">All Statuses</option>
        <option value="pending">Pending</option>
        <option value="processing">Processing</option>
        <option value="shipped">Shipped</option>
        <option value="delivered">Delivered</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>

    <div class="stat-card">
      <table class="table-luxe w-100">
        <thead><tr><th>Order #</th><th>Customer</th><th>Date</th><th>Payment</th><th>Total</th><th>Status</th></tr></thead>
        <tbody id="ordersTableBody"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/main.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin-common.js"></script>
<script src="js/admin-orders.js"></script>
</body>
</html>
