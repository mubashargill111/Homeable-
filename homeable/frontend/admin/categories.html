<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Categories — Homeable Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-admin-page="categories">

<div class="admin-shell" id="adminShell">
  <div id="adminSidebarMount"></div>

  <main class="admin-main" id="adminCategoriesRoot">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div><span class="eyebrow">Catalog</span><h2 style="margin:0;">Categories</h2></div>
      <button class="btn btn-primary" id="addCategoryBtn"><i class="bi bi-plus-lg"></i> Add Category</button>
    </div>

    <div class="stat-card">
      <table class="table-luxe w-100">
        <thead><tr><th>Image</th><th>Name</th><th>Description</th><th>Products</th><th>Actions</th></tr></thead>
        <tbody id="categoriesTableBody"></tbody>
      </table>
    </div>
  </main>
</div>

<!-- Category Modal -->
<div class="modal fade" id="categoryModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content form-luxe" style="border-radius: var(--radius-md); border:none;">
      <div class="modal-header">
        <h5 class="modal-title" id="categoryModalTitle">Add Category</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="categoryForm">
        <div class="modal-body">
          <div class="mb-3"><label>Category Name</label><input type="text" id="categoryName" class="form-control" required></div>
          <div class="mb-3"><label>Description</label><textarea id="categoryDescription" class="form-control" rows="2"></textarea></div>
          <div class="mb-3"><label>Image URL</label><input type="text" id="categoryImage" class="form-control" placeholder="images/categories/example.jpg"></div>
        </div>
        <div class="modal-footer"><button type="submit" class="btn btn-primary">Save Category</button></div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/main.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin-common.js"></script>
<script src="js/admin-categories.js"></script>
</body>
</html>
