<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Products — Homeable Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-admin-page="products">

<div class="admin-shell" id="adminShell">
  <div id="adminSidebarMount"></div>

  <main class="admin-main" id="adminProductsRoot">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div><span class="eyebrow">Catalog</span><h2 style="margin:0;">Products</h2></div>
      <button class="btn btn-primary" id="addProductBtn"><i class="bi bi-plus-lg"></i> Add Product</button>
    </div>

    <div class="stat-card">
      <table class="table-luxe w-100">
        <thead><tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead>
        <tbody id="productsTableBody"></tbody>
      </table>
    </div>
  </main>
</div>

<!-- Product Modal -->
<div class="modal fade" id="productModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content form-luxe" style="border-radius: var(--radius-md); border:none;">
      <div class="modal-header">
        <h5 class="modal-title" id="productModalTitle">Add Product</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="productForm">
        <div class="modal-body row g-3">
          <div class="col-md-6"><label>Product Name</label><input type="text" id="productName" class="form-control" required></div>
          <div class="col-md-6"><label>Category</label><select id="productCategorySelect" class="form-select" required></select></div>
          <div class="col-md-4"><label>SKU</label><input type="text" id="productSku" class="form-control" required></div>
          <div class="col-md-4"><label>Price ($)</label><input type="number" step="0.01" id="productPrice" class="form-control" required></div>
          <div class="col-md-4"><label>Compare-at Price ($)</label><input type="number" step="0.01" id="productComparePrice" class="form-control"></div>
          <div class="col-md-6"><label>Stock Quantity</label><input type="number" id="productStock" class="form-control" required></div>
          <div class="col-md-6"><label>Product Image</label><input type="file" id="productImageFile" class="form-control" accept="image/*"></div>
          <div class="col-12"><label>Short Description</label><input type="text" id="productShortDesc" class="form-control"></div>
          <div class="col-12"><label>Full Description</label><textarea id="productDescription" class="form-control" rows="3"></textarea></div>
          <div class="col-12"><label>Specifications (one per line)</label><textarea id="productSpecs" class="form-control" rows="3"></textarea></div>
          <div class="col-12 d-flex gap-4">
            <div class="form-check"><input class="form-check-input" type="checkbox" id="productFeatured"><label class="form-check-label">Featured</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" id="productNew"><label class="form-check-label">New Arrival</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" id="productBestseller"><label class="form-check-label">Bestseller</label></div>
          </div>
        </div>
        <div class="modal-footer"><button type="submit" class="btn btn-primary">Save Product</button></div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/main.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin-common.js"></script>
<script src="js/admin-products.js"></script>
</body>
</html>
