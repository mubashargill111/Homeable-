<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — Homeable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-admin-page="dashboard">

<div class="admin-shell" id="adminShell">
  <div id="adminSidebarMount"></div>

  <main class="admin-main">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <span class="eyebrow">Overview</span>
        <h2 style="margin:0;">Dashboard</h2>
      </div>
      <span class="text-muted">Signed in as <strong id="adminUserName"></strong></span>
    </div>

    <div id="adminDashboardRoot">
      <div class="row g-4 mb-4">
        <div class="col-md-3">
          <div class="stat-card"><div class="stat-value" id="statRevenue">$0</div><div class="stat-label">Total Revenue</div></div>
        </div>
        <div class="col-md-3">
          <div class="stat-card"><div class="stat-value" id="statOrders">0</div><div class="stat-label">Total Orders</div></div>
        </div>
        <div class="col-md-3">
          <div class="stat-card"><div class="stat-value" id="statUsers">0</div><div class="stat-label">Customers</div></div>
        </div>
        <div class="col-md-3">
          <div class="stat-card"><div class="stat-value" id="statProducts">0</div><div class="stat-label">Products</div></div>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-4">
          <div class="stat-card">
            <h6 class="mb-3">Orders by Status</h6>
            <div id="statusBreakdown"></div>
          </div>
        </div>
        <div class="col-lg-8">
          <div class="stat-card">
            <h6 class="mb-3">Recent Orders</h6>
            <table class="table-luxe w-100">
              <thead><tr><th>Order #</th><th>Customer</th><th>Date</th><th>Status</th><th>Total</th></tr></thead>
              <tbody id="recentOrdersTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/main.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin-common.js"></script>
<script src="js/admin-dashboard.js"></script>
</body>
</html>
