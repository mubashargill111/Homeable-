<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Homeable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="account">

<div id="site-header"></div>

<div class="auth-card form-luxe">
  <h2>Welcome back</h2>
  <p class="sub">Sign in to your Homeable account.</p>

  <form id="loginForm">
    <div class="mb-3"><label>Email Address</label><input type="email" id="email" class="form-control" required></div>
    <div class="mb-3">
      <label>Password</label>
      <input type="password" id="password" class="form-control" required>
    </div>
    <div class="d-flex justify-content-between align-items-center mb-4">
      <label class="d-flex align-items-center gap-2" style="font-size:13px;">
        <input type="checkbox" checked> Remember me
      </label>
      <a href="forgot-password.html" style="font-size:13px;" class="text-accent">Forgot password?</a>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Sign In</button>
  </form>

  <p class="text-center mt-4" style="font-size:14px;">
    Don't have an account? <a href="create-account.html" class="text-accent">Create one</a>
  </p>

  <div class="text-center mt-3" style="font-size:12px; color:var(--color-ink-soft);">
    Demo admin login: admin@homeable.com / Password123!
  </div>
</div>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/partials.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
