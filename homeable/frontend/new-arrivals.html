<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Arrivals - Homeable</title>
<meta name="description" content="Explore the newest premium furniture, lighting, wall art, textiles, and decor arrivals at Homeable.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="new-arrivals">

<div id="site-header"></div>

<section class="collection-hero">
  <div class="container-xl">
    <span class="eyebrow">Fresh in store</span>
    <h1>New Arrivals</h1>
    <p>Discover the latest high-end decor pieces selected for refined modern interiors.</p>
    <div class="collection-actions">
      <a href="shop.html" class="btn btn-outline-light">All Products</a>
      <a href="shop.html?filter=bestseller" class="btn btn-primary">Best Sellers</a>
    </div>
  </div>
</section>

<main class="container-xl section-sm shop-layout-wrap">
  <div class="row g-4">
    <aside class="col-lg-3">
      <div class="filters-panel">
        <div class="d-flex justify-content-between align-items-center">
          <strong>Filters</strong>
          <button id="clearFilters" class="btn btn-sm btn-link-accent" type="button">Clear all</button>
        </div>

        <h6>Category</h6>
        <div id="categoryFilters">
          <label class="filter-check"><input type="radio" name="categoryFilter" value=""> All Categories</label>
        </div>

        <h6>Price Range</h6>
        <form id="priceFilterForm" class="price-filter-form">
          <input type="number" id="minPrice" class="form-control form-control-sm" placeholder="Min">
          <span>-</span>
          <input type="number" id="maxPrice" class="form-control form-control-sm" placeholder="Max">
          <button class="btn btn-sm btn-outline" type="submit"><i class="bi bi-check2"></i></button>
        </form>

        <h6>Search</h6>
        <input type="text" id="shopSearchInput" class="form-control form-control-sm" placeholder="Search new arrivals...">
      </div>
    </aside>

    <section class="col-lg-9">
      <div class="toolbar-row">
        <span id="resultCount" class="text-muted"></span>
        <select id="sortSelect" class="form-select sort-select">
          <option value="newest">Newest</option>
          <option value="popular">Popular</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
        </select>
      </div>

      <div class="products-grid" id="productsGrid">
        <div class="spinner-luxe"></div>
      </div>

      <ul class="pagination-luxe" id="pagination"></ul>
    </section>
  </div>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/partials.js"></script>
<script src="js/main.js"></script>
<script src="js/utils.js"></script>
<script src="js/shop.js"></script>
</body>
</html>
