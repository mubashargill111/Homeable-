<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed — Homeable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cart">

<div id="site-header"></div>

<div id="confirmationRoot" class="container-xl section-sm">
  <div class="text-center mb-5">
    <div style="font-size:52px; color:var(--color-success);"><i class="bi bi-check-circle"></i></div>
    <h1 class="mt-3">Thank you for your order!</h1>
    <p class="text-muted">Order <strong id="confOrderNumber">—</strong> has been placed successfully.</p>
  </div>

  <div class="row g-5 justify-content-center">
    <div class="col-lg-7">
      <div class="checkout-step">
        <h5 class="mb-3">Order Items</h5>
        <div id="confItems"></div>
      </div>
      <div class="checkout-step">
        <h5 class="mb-3">Shipping To</h5>
        <p id="confShippingAddress" class="text-muted" style="white-space:pre-line;"></p>
      </div>
    </div>
    <div class="col-lg-4">
      <div class="cart-summary">
        <div class="summary-row"><span>Date</span><span id="confDate"></span></div>
        <div class="summary-row"><span>Payment</span><span id="confPayment"></span></div>
        <div class="summary-row"><span>Status</span><span id="confStatus"></span></div>
        <hr style="border-color:var(--color-line);">
        <div class="summary-row"><span>Subtotal</span><span id="confSubtotal">$0.00</span></div>
        <div class="summary-row"><span>Discount</span><span id="confDiscount">$0.00</span></div>
        <div class="summary-row"><span>Shipping</span><span id="confShipping">$0.00</span></div>
        <div class="summary-row"><span>Tax</span><span id="confTax">$0.00</span></div>
        <div class="summary-row total"><span>Total</span><span id="confTotal">$0.00</span></div>
        <a href="/dashboard.html" class="btn btn-outline btn-block mt-3">View My Orders</a>
        <a href="/shop.html" class="btn btn-primary btn-block mt-2">Continue Shopping</a>
      </div>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/partials.js"></script>
<script src="js/main.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/order-confirmation.js"></script>
</body>
</html>
