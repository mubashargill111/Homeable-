<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Homeable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cart">

<div id="site-header"></div>

<div class="page-header">
  <span class="eyebrow">Almost there</span>
  <h1>Checkout</h1>
  <div class="breadcrumb-luxe"><a href="/index.html">Home</a> / <a href="/cart.html">Cart</a> / Checkout</div>
</div>

<form id="checkoutForm" class="container-xl section-sm" style="padding-top:0;">
  <div class="row g-5">
    <div class="col-lg-8">

      <!-- Billing -->
      <div class="checkout-step form-luxe">
        <h5 class="mb-4"><i class="bi bi-person text-accent"></i> Billing Address</h5>
        <div class="row g-3">
          <div class="col-md-6"><label>Full Name</label><input type="text" id="billingName" class="form-control" required></div>
          <div class="col-md-6"><label>Phone</label><input type="text" id="billingPhone" class="form-control" required></div>
          <div class="col-12"><label>Address</label><textarea id="billingAddress" class="form-control" rows="2" placeholder="Street, city, state, postal code, country" required></textarea></div>
        </div>
      </div>

      <!-- Shipping -->
      <div class="checkout-step form-luxe">
        <h5 class="mb-3"><i class="bi bi-truck text-accent"></i> Shipping Address</h5>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="sameAsBilling" checked>
          <label class="form-check-label" for="sameAsBilling">Same as billing address</label>
        </div>
        <div id="shippingFields" style="display:none;">
          <div class="row g-3">
            <div class="col-md-6"><label>Full Name</label><input type="text" id="shippingName" class="form-control"></div>
            <div class="col-md-6"><label>Phone</label><input type="text" id="shippingPhone" class="form-control"></div>
            <div class="col-12"><label>Address</label><textarea id="shippingAddress" class="form-control" rows="2"></textarea></div>
          </div>
        </div>
      </div>

      <!-- Payment -->
      <div class="checkout-step form-luxe">
        <h5 class="mb-4"><i class="bi bi-credit-card text-accent"></i> Payment Method</h5>

        <label class="payment-option selected d-flex align-items-center gap-3 mb-3">
          <input type="radio" name="paymentMethod" value="cod" checked>
          <div>
            <strong>Cash on Delivery</strong>
            <div class="text-muted" style="font-size:13px;">Pay with cash when your order arrives.</div>
          </div>
        </label>

        <label class="payment-option d-flex align-items-center gap-3 mb-3">
          <input type="radio" name="paymentMethod" value="credit_card">
          <div>
            <strong>Credit / Debit Card</strong>
            <div class="text-muted" style="font-size:13px;">Simulated card entry for this demo project.</div>
          </div>
        </label>

        <div id="creditCardFields" style="display:none;">
          <div class="row g-3">
            <div class="col-12"><label>Card Number</label><input type="text" class="form-control" placeholder="4242 4242 4242 4242"></div>
            <div class="col-md-6"><label>Expiry</label><input type="text" class="form-control" placeholder="MM/YY"></div>
            <div class="col-md-6"><label>CVC</label><input type="text" class="form-control" placeholder="123"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="cart-summary">
        <h5 class="mb-4">Order Review</h5>
        <div id="checkoutItems" class="mb-3"></div>
        <hr style="border-color:var(--color-line);">
        <div class="summary-row"><span>Subtotal</span><span id="checkoutSubtotal">$0.00</span></div>
        <div class="summary-row"><span>Shipping</span><span id="checkoutShipping">$0.00</span></div>
        <div class="summary-row"><span>Tax</span><span id="checkoutTax">$0.00</span></div>
        <div class="summary-row total"><span>Total</span><span id="checkoutTotal">$0.00</span></div>
        <input type="text" id="checkoutCoupon" class="form-control mb-3" placeholder="Coupon code">
        <button type="submit" class="btn btn-primary btn-block">Place Order</button>
      </div>
    </div>
  </div>
</form>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/partials.js"></script>
<script src="js/main.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
