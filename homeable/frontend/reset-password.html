<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Homeable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="account">

<div id="site-header"></div>

<div class="auth-card form-luxe">
  <h2>Reset your password</h2>
  <p class="sub">Choose a new password for your account.</p>

  <form id="resetForm">
    <input type="hidden" id="resetToken">
    <div class="mb-3"><label>New Password</label><input type="password" id="newPassword" class="form-control" minlength="8" required></div>
    <div class="mb-4"><label>Confirm New Password</label><input type="password" id="confirmNewPassword" class="form-control" minlength="8" required></div>
    <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
  </form>
</div>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/partials.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
